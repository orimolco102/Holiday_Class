- name: Install Docker on Ubuntu
  hosts: servers
  become: true
  tasks:
    - name: Install dependencies
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release

    # - name: Add Docker GPG key
    #   apt_key:
    #     url: https://download.docker.com/linux/ubuntu/gpg
    #     state: present

    # - name: Add Docker APT repository
    #   apt_repository:
    #     repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    #     state: present

    - name: Ensure the keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Install Docker Engine
      apt:
        name: docker-ce
        state: present
        update_cache: true

    - name: Remove conflicting deb822-format Docker source, if present
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Pull the latest holiday_class image
      community.docker.docker_image_pull:
        name: orimolco/holiday_class
        tag: latest
        pull: always

    - name: Remove old containers
      community.docker.docker_container:
        name: holiday_class
        state: absent

    - name: Run new container
      community.docker.docker_container:
        name: holiday_class
        image: orimolco/holiday_class:latest
        ports:
        - 3000:3000
        restart_policy: unless-stopped
        detach: true
    
    - name: Verifiy app is running
      ansible.builtin.uri:
        url: http://localhost:3000/health
        status_code: 200
      register: result
      until: result.status == 200
      retries: 5
      delay: 3